# The demo chatbot behind joelstevick.com/demo. It has no public URL: the site's
# functions call it through the DEMO service binding.
name = "joelstevick-com-demo"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# The OAuth library fetches a client's metadata document (demo/src/oauth.ts); this flag keeps that fetch to public addresses.
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "joelstevick-com-demos"
database_id = "32fc04d8-e2c7-4690-b1e1-18895851b3e1"

[[vectorize]]
binding = "VECTORS"
index_name = "joelstevick-com-demo"

[ai]
binding = "AI"

# The MCP server's OAuth store: clients, grants and tokens (hashed), kept by the OAuth library (docs/plans/demo-mcp.md).
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "850d40fcecf94ee0af68977a74e61592"

# Tells Joel when a demo's first upload finishes.
[[services]]
binding = "MAILER"
service = "joelstevick-com-mailer"

# Deletes the documents of demos unused for 10 days, daily. ANTHROPIC_API_KEY is a secret.
[triggers]
crons = ["17 4 * * *"]
